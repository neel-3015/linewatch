AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Requires a default VPC in the region.
  linewatch - IIoT telemetry dashboard on one hardened EC2 instance.
  Public port 80 only (no SSH; admin access via SSM Session Manager),
  IMDSv2 enforced, encrypted root volume, API key generated on the instance.

Parameters:
  RepoUrl:
    Type: String
    Default: https://github.com/neel-3015/linewatch.git
    Description: Public git URL the instance clones at boot
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro, t3.small]
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may view the dashboard (e.g. your IP as x.x.x.x/32)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: linewatch - HTTP in from AllowedCidr only, no SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: dashboard
      Tags:
        - Key: Name
          Value: linewatch-web

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # least privilege: only what Session Manager needs, nothing else
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only (blocks SSRF credential theft)
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 10
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -uxo pipefail
            dnf install -y git aws-cfn-bootstrap
            git clone --depth 1 ${RepoUrl} /opt/linewatch-src \
              && bash /opt/linewatch-src/deploy/setup.sh /opt/linewatch-src \
              && for i in $(seq 30); do curl -sf http://127.0.0.1/healthz && break; sleep 2; done \
              && curl -sf http://127.0.0.1/healthz
            # tell CloudFormation whether first boot actually worked
            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}

  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: linewatch

Outputs:
  DashboardUrl:
    Description: Live dashboard (the stack only completes after the app passes a health check)
    Value: !Sub "http://${Instance.PublicDnsName}"
  ShellAccess:
    Description: Admin shell without SSH
    Value: !Sub "aws ssm start-session --target ${Instance}"
